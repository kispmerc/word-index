<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โดนกูโกงไปดิ</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,460;0,9..144,600;1,9..144,460;1,9..144,560&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --bg: #F5F6F9;
    --surface: #FFFFFF;
    --ink: #12141F;
    --ink-soft: #5B5F72;
    --ink-faint: #9498A8;
    --line: #E4E6ED;
    --accent: #3452F5;
    --accent-ink: #EEF0FF;
    --accent-deep: #1F35B8;
    --watermark: rgba(18, 20, 31, 0.05);
    --radius: 14px;
  }

  * { box-sizing: border-box; }

  html { -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(52,82,245,0.07), transparent 42%),
      radial-gradient(circle at 88% 92%, rgba(52,82,245,0.05), transparent 40%);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 20px 60px;
  }

  .app {
    width: 100%;
    max-width: 860px;
  }

  /* ---------- อะไรวะลืม ---------- */

  .masthead {
    display: flex;
    align-items: baseline;
    gap: 14px;
    margin-bottom: 28px;
  }

  .mark {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 460;
    font-size: 26px;
    color: var(--accent);
    line-height: 1;
  }

  .masthead h1 {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 20px;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
  }

  .masthead p {
    margin: 2px 0 0;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  /* ---------- หาคำ ---------- */

  .search-shell {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(18,20,31,0.04);
    display: flex;
    align-items: center;
    padding: 4px 6px 4px 18px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .search-shell:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-ink);
  }

  .search-shell svg {
    flex: none;
    color: var(--ink-faint);
  }

  #letterInput {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Fraunces', serif;
    font-weight: 460;
    font-size: 22px;
    color: var(--ink);
    padding: 14px 10px;
    min-width: 0;
    text-transform: lowercase;
  }

  #letterInput::placeholder {
    color: var(--ink-faint);
    font-style: italic;
  }

  .clear-btn {
    flex: none;
    display: none;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: none;
    background: var(--bg);
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 16px;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .clear-btn:hover { background: var(--line); color: var(--ink); }

  /* ---------- คำเริ่ม ---------- */

  .rail {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 16px 0 6px;
  }

  .letter {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 13px;
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 9px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }

  .letter:hover {
    background: var(--surface);
    border-color: var(--line);
    color: var(--ink);
  }

  .letter.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .letter:focus-visible,
  .clear-btn:focus-visible {
    outline: 2px solid var(--accent-deep);
    outline-offset: 2px;
  }

  /* ---------- คำที่ออกมา ---------- */

  .panel {
    position: relative;
    margin-top: 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 34px clamp(20px, 4vw, 40px) 30px;
    min-height: 320px;
    overflow: hidden;
  }

  .watermark {
    position: absolute;
    top: -0.14em;
    right: 18px;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(64px, 16vw, 148px);
    color: var(--watermark);
    line-height: 1;
    pointer-events: none;
    user-select: none;
    z-index: 0;
    transition: opacity 0.2s ease;
  }

  .panel-inner {
    position: relative;
    z-index: 1;
  }

  .status-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    min-height: 22px;
  }

  #status {
    font-size: 13.5px;
    color: var(--ink-soft);
    font-weight: 500;
  }

  #status strong {
    color: var(--accent-deep);
    font-weight: 700;
  }

  .empty-state, .no-results {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 18px;
    color: var(--ink-faint);
    padding: 40px 4px 10px;
    max-width: 34ch;
    line-height: 1.5;
  }

  .word-columns {
    columns: 3 160px;
    column-gap: 28px;
  }

  @media (max-width: 560px) {
    .word-columns { columns: 2 130px; }
  }

  .word-entry {
    font-family: 'Fraunces', serif;
    font-weight: 460;
    font-size: 16.5px;
    color: var(--ink);
    break-inside: avoid;
    padding: 5px 0;
    border-bottom: 1px solid var(--line);
    cursor: default;
  }

  .word-entry .hit {
    color: var(--accent-deep);
    font-weight: 600;
    font-style: italic;
  }

  footer {
    text-align: center;
    margin-top: 22px;
    font-size: 12px;
    color: var(--ink-faint);
  }

  @media (max-width: 480px) {
    .panel { padding: 26px 18px 24px; border-radius: 16px; }
    #letterInput { font-size: 19px; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="masthead">
    <span class="mark">Aa</span>
    <div>
      <h1>โดนกูโกงไปดิ555</h1>
      <p>พิมพ์เพื่อค้นหา</p>
    </div>
  </div>

  <div class="search-shell">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="letterInput" placeholder="เริ่มพิมพ์ตัวอักษร..." autocomplete="off" spellcheck="false">
    <button class="clear-btn" id="clearBtn" aria-label="ล้างการค้นหา">✕</button>

  <div class="rail" id="rail"></div>

  <div class="panel">
    <div class="watermark" id="watermark"></div>
    <div class="panel-inner">
      <div class="status-row">

      </div>
      <div id="results"></div>
    </div>
  </div>

  <footer>เรียงตามตัวอักษร A–Z</footer>

</div>

  const railEl = document.getElementById('rail');
  const input = document.getElementById('letterInput');
  const clearBtn = document.getElementById('clearBtn');
  const statusEl = document.getElementById('status');
  const resultsEl = document.getElementById('results');
  const watermarkEl = document.getElementById('watermark');

  const ALPHABET = 'abcdefghijklmnopqrstuvwxyz'.split('');
  ALPHABET.forEach(letter => {
    const btn = document.createElement('button');
    btn.className = 'letter';
    btn.type = 'button';
    btn.dataset.letter = letter;
    btn.textContent = letter.toUpperCase();
    btn.addEventListener('click', () => {
      input.value = letter;
      render(letter);
      input.focus();
    });
    railEl.appendChild(btn);
  });
  const letterButtons = railEl.querySelectorAll('.letter');

  function normalize(raw) {
    return raw.toLowerCase().replace(/[^a-z]/g, '').slice(0, 24);
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  }

  function render(prefix) {
    letterButtons.forEach(btn => btn.classList.toggle('active', prefix.length === 1 && btn.dataset.letter === prefix));
    clearBtn.style.display = prefix ? 'flex' : 'none';
    watermarkEl.textContent = prefix ? prefix : '';
    watermarkEl.style.opacity = prefix ? '1' : '0';

    if (!prefix) {
      statusEl.textContent = '';
      resultsEl.innerHTML = '<p class="empty-state">แตะตัวอักษรด้านบน หรือเริ่มพิมพ์เพื่อค้นหาคำศัพท์</p>';
      return;
    }

    const matches = WORDS.filter(w => w.startsWith(prefix));

    if (matches.length === 0) {
      statusEl.innerHTML = 'ไม่พบคำที่ขึ้นต้นด้วย "' + escapeHtml(prefix) + '"';
      resultsEl.innerHTML = '<p class="no-results">ลองพิมพ์ตัวอักษรชุดอื่น หรือแตะตัวอักษรด้านบน</p>';
      return;
    }

    statusEl.innerHTML = 'พบ <strong>' + matches.length.toLocaleString('th-TH') + '</strong> คำ ที่ขึ้นต้นด้วย "' + escapeHtml(prefix) + '"';

    const html = matches.map(w => {
      const rest = escapeHtml(w.slice(prefix.length));
      return '<div class="word-entry"><span class="hit">' + escapeHtml(prefix) + '</span>' + rest + '</div>';
    }).join('');

    resultsEl.innerHTML = '<div class="word-columns">' + html + '</div>';
  }

  input.addEventListener('input', (e) => {
    const v = normalize(e.target.value);
    e.target.value = v;
    render(v);
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    input.focus();
    render('');
  });

  render('');
</script>
